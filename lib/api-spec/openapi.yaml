openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Kaya Foods storefront and administration API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: storefront
  - name: admin
  - name: media
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /storefront:
    get:
      operationId: getStorefront
      tags: [storefront]
      responses:
        "200":
          description: Published storefront data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Storefront" }
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      responses:
        "200":
          description: Current administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminIdentity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/products:
    get:
      operationId: getAdminProducts
      tags: [admin]
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdminProduct
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/products/{id}:
    put:
      operationId: updateAdminProduct
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteAdminProduct
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/Version"
      responses:
        "204": { description: Product deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updateAdminSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/media/upload-url:
    post:
      operationId: createMediaUploadUrl
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaUploadInput" }
      responses:
        "200":
          description: Temporary direct upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUploadTarget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/media/complete:
    post:
      operationId: completeMediaUpload
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaCompleteInput" }
      responses:
        "200":
          description: Published media URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /media/{id}:
    get:
      operationId: getMedia
      tags: [media]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Re-encoded public image bytes
          content:
            image/webp:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    Version:
      name: version
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Administrator grant required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Stale version
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }
    AdminIdentity:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: string }
    ProductSize:
      type: object
      additionalProperties: false
      required: [id, label, price]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        label: { type: string, minLength: 1, maxLength: 100 }
        price: { type: integer, minimum: 0, maximum: 2147483647 }
    ProductInput:
      type: object
      additionalProperties: false
      required: [name, category, shortDescription, imageUrl, altText, availability, sizes, isSample, published]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        category:
          type: string
          enum: [Jam, Juices, Chilli, Tomato Paste]
        shortDescription: { type: string, maxLength: 1000 }
        imageUrl: { type: string, maxLength: 2048 }
        altText: { type: string, maxLength: 500 }
        availability:
          type: string
          enum: [available, coming_soon, unavailable]
        sizes:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ProductSize" }
        isSample: { type: boolean }
        published: { type: boolean }
    ProductUpdate:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1 }
    Product:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          required: [id, version]
          properties:
            id: { type: string, minLength: 1, maxLength: 100 }
            version: { type: integer, minimum: 1 }
    SocialLinks:
      type: object
      additionalProperties: false
      required: [instagram, facebook]
      properties:
        instagram: { type: string, maxLength: 2048 }
        facebook: { type: string, maxLength: 2048 }
    Settings:
      type: object
      additionalProperties: false
      required: [name, description, whatsappNumber, contactEmail, contactPhone, openingHours, deliveryAreas, deliveryFee, paymentMethods, socialLinks, heroBadge, heroText, storyTitle, storyParagraph1, storyParagraph2, storyImageUrl, storyImageAlt, storyImageCaption, logoUrl, illustrationNotice, version]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        whatsappNumber: { type: string, pattern: "^$|^[1-9][0-9]{7,14}$" }
        contactEmail: { type: string, maxLength: 320 }
        contactPhone: { type: string, maxLength: 100 }
        openingHours: { type: string, maxLength: 500 }
        deliveryAreas: { type: string, maxLength: 1000 }
        deliveryFee: { type: string, maxLength: 200 }
        paymentMethods: { type: string, maxLength: 500 }
        socialLinks: { $ref: "#/components/schemas/SocialLinks" }
        heroBadge: { type: string, maxLength: 500 }
        heroText: { type: string, maxLength: 2000 }
        storyTitle: { type: string, maxLength: 500 }
        storyParagraph1: { type: string, maxLength: 5000 }
        storyParagraph2: { type: string, maxLength: 5000 }
        storyImageUrl: { type: string, maxLength: 2048 }
        storyImageAlt: { type: string, maxLength: 500 }
        storyImageCaption: { type: string, maxLength: 500 }
        logoUrl: { type: string, maxLength: 2048 }
        illustrationNotice: { type: string, maxLength: 1000 }
        version: { type: integer, minimum: 1 }
    Storefront:
      type: object
      additionalProperties: false
      required: [products, settings]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        settings: { $ref: "#/components/schemas/Settings" }
    MediaUploadInput:
      type: object
      additionalProperties: false
      required: [contentType, size]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
    MediaUploadTarget:
      type: object
      additionalProperties: false
      required: [uploadId, uploadUrl]
      properties:
        uploadId: { type: string, format: uuid }
        uploadUrl: { type: string }
    MediaCompleteInput:
      type: object
      additionalProperties: false
      required: [uploadId]
      properties:
        uploadId: { type: string, format: uuid }
    MediaResult:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string }