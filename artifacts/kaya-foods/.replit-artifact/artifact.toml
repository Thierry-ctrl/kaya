kind = "web"
previewPath = "/"
title = "Kaya Foods"
description = "A mobile-first Rwandan food catalogue with a browser-based basket and WhatsApp order requests. Static client-review prototype."
version = "1.0.0"
id = "artifacts/kaya-foods"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24628

[services.development]
run = "pnpm --filter @workspace/kaya-foods run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kaya-foods", "run", "build" ]
serve = "static"
publicDir = "artifacts/kaya-foods/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24628"
BASE_PATH = "/"
