# Replace foods.example.com and certificate paths. Install after obtaining TLS.
server {
    listen 80;
    server_name foods.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name foods.example.com;
    ssl_certificate /etc/letsencrypt/live/foods.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foods.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/kaya/current/artifacts/kaya-foods/dist/public;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, rather than append client-controlled forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}